<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JA-Applications</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    img {
      display: block;
      width: min(236px, 70vw);
      height: auto;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
    }
  </style>
</head>
<body>
  <main>
    <img src="assets/logo.png" alt="Logo JA-Applications">
    <h1>JA-Applications</h1>
  </main>
</body>
</html>
